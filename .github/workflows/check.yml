name: Проверка на сайта
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Готов статичен сайт за преглед
        uses: actions/upload-artifact@v4
        with:
          name: dido-static-preview
          path: dist/
          retention-days: 7
          if-no-files-found: error
